<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>商圈及门店信息可视化</title>
    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
        .info-window { padding: 10px; font-size: 14px; line-height: 1.5; min-width: 250px;}
        .info-window h4 { margin: 0 0 10px 0; font-size: 16px; color: #333; border-bottom: 1px solid #eee; padding-bottom: 5px;}
        .info-window table { border-collapse: collapse; width: 100%; }
        .info-window table th, .info-window table td { border: 1px solid #ccc; padding: 5px; text-align: left; }
        .info-window table th { background-color: #f9f9f9; width: 45%;}
        .legend-box { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9); color: #333; padding: 15px; border-radius: 6px; z-index: 999; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); line-height: 1.6; pointer-events: auto; }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; cursor: pointer; }
        .legend-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 3px rgba(0,0,0,0.5); margin-right: 10px; margin-left: 6px; flex-shrink: 0;}
        .legend-tip { margin-top: 10px; padding-top: 10px; border-top: 1px solid #ddd; font-size: 13px; color: #666; }
    </style>
    <script src="https://webapi.amap.com/maps?v=2.0&key=05274d5027e6b22978b2ade4630f3596"></script>
</head>
<body>
<div class="legend-box">
    <label class="legend-item"><input type="checkbox" id="toggle-red" checked> <div class="legend-dot" style="background-color: red;"></div>已有汉堡店</label>
    <label class="legend-item"><input type="checkbox" id="toggle-green" checked> <div class="legend-dot" style="background-color: green;"></div>绣球门店</label>
    <label class="legend-item"><input type="checkbox" id="toggle-blue" checked> <div class="legend-dot" style="background-color: #4A90E2;"></div>聚客点</label>
    <div class="legend-tip">💡 提示：点击各色圆点和六边形<br>可展示详细信息</div>
</div>
<div id="container"></div>
<script>
    fetch('output_business_district.json')
        .then(res => res.json())
        .then(bizData => {
            const map = new AMap.Map('container', {
                zoom: 12,
                center: [119.3, 26.08] // Fuzhou approx center
            });

            const infoWindow = new AMap.InfoWindow({ offset: new AMap.Pixel(0, -10) });

            let mapOverlays = [];
            let redMarkers = [];
            let greenMarkers = [];
            let blueMarkers = [];

            let addedCoords = new Set();
            function getOffsettedCoord(lon, lat) {
                let offsetLon = parseFloat(lon);
                let offsetLat = parseFloat(lat);
                let key = `${offsetLon.toFixed(5)},${offsetLat.toFixed(5)}`;
                let radius = 0.00015;
                let angle = 0;
                while (addedCoords.has(key)) {
                    offsetLon = parseFloat(lon) + radius * Math.cos(angle);
                    offsetLat = parseFloat(lat) + radius * Math.sin(angle);
                    key = `${offsetLon.toFixed(5)},${offsetLat.toFixed(5)}`;
                    angle += Math.PI / 4;
                    if (angle >= Math.PI * 2) {
                        angle = 0;
                        radius += 0.00015;
                    }
                }
                addedCoords.add(key);
                return [offsetLon, offsetLat];
            }

            bizData.forEach(biz => {
                if (!biz.boundary || biz.boundary.length === 0) return;

                // 绘制六边形
                const path = biz.boundary;
                const polygon = new AMap.Polygon({
                    path: path,
                    fillColor: '#1791fc',
                    fillOpacity: 0.4,
                    strokeColor: '#0066cc',
                    strokeWeight: 2,
                    extData: biz
                });

                polygon.on('click', function(e) {
                    const data = e.target.getExtData();
                    let content = `<div class="info-window"><h4>商圈信息</h4><table>`;
                    content += `<tr><th>六边形ID</th><td>${data['六边形ID'] || ''}</td></tr>`;
                    const keys = ['绣球开店计划', '商圈排序'];
                    keys.forEach(k => {
                        content += `<tr><th>${k}</th><td>${data[k] !== null && data[k] !== undefined ? data[k] : ''}</td></tr>`;
                    });
                    content += `</table></div>`;
                    infoWindow.setContent(content);
                    infoWindow.open(map, e.lnglat);
                });

                mapOverlays.push(polygon);
                map.add(polygon);
                
                // 门店 (红点)
                if (biz.shops && biz.shops.length > 0) {
                    biz.shops.forEach(shop => {
                        if (shop.shop_lon02 && shop.shop_lat02) {
                            const [lon, lat] = getOffsettedCoord(shop.shop_lon02, shop.shop_lat02);
                            const markerContent = '<div style="width:20px;height:20px;background-color:red;border-radius:50%;border:2px solid white;box-shadow: 0 0 3px rgba(0,0,0,0.5);"></div>';
                            const marker = new AMap.Marker({
                                position: [lon, lat],
                                map: map,
                                content: markerContent,
                                offset: new AMap.Pixel(-12, -12),
                                title: shop.shop_name || shop.shop_id,
                                extData: shop
                            });
                            
                            marker.on('click', function(me) {
                                const sData = me.target.getExtData();
                                let sContent = `<div class="info-window"><h4>门店信息</h4><table>`;
                                sContent += `<tr><th>门店 ID</th><td>${sData.shop_id || ''}</td></tr>`;
                                sContent += `<tr><th>门店名称</th><td>${sData.shop_name || ''}</td></tr>`;
                                if (sData.open_date) sContent += `<tr><th>开业时间</th><td>${sData.open_date || ''}</td></tr>`;
                                sContent += `</table></div>`;
                                
                                infoWindow.setContent(sContent);
                                infoWindow.open(map, me.target.getPosition());
                            });
                            
                            mapOverlays.push(marker);
                            redMarkers.push(marker);
                        }
                    });
                }

                // xq_shops (绿圆点)
                if (biz.xq_shops && biz.xq_shops.length > 0) {
                    biz.xq_shops.forEach(shop => {
                        if (shop.shop_lon02 && shop.shop_lat02) {
                            const [lon, lat] = getOffsettedCoord(shop.shop_lon02, shop.shop_lat02);
                            const markerContent = '<div style="width:20px;height:20px;background-color:green;border-radius:50%;border:2px solid white;box-shadow: 0 0 3px rgba(0,0,0,0.5);"></div>';
                            const marker = new AMap.Marker({
                                position: [lon, lat],
                                map: map,
                                content: markerContent,
                                offset: new AMap.Pixel(-12, -12),
                                title: shop.shop_name || shop.shop_id,
                                extData: shop
                            });
                            
                            marker.on('click', function(me) {
                                const sData = me.target.getExtData();
                                let sContent = `<div class="info-window"><h4>绣球门店信息</h4><table>`;
                                sContent += `<tr><th>门店 ID</th><td>${sData.shop_id || ''}</td></tr>`;
                                sContent += `<tr><th>门店名称</th><td>${sData.shop_name || ''}</td></tr>`;
                                sContent += `</table></div>`;
                                
                                infoWindow.setContent(sContent);
                                infoWindow.open(map, me.target.getPosition());
                            });
                            
                            mapOverlays.push(marker);
                            greenMarkers.push(marker);
                        }
                    });
                }

                // gathering_points (蓝圆点)
                if (biz.gathering_points && biz.gathering_points.length > 0) {
                    biz.gathering_points.forEach(pt => {
                        if (pt.shop_lon02 && pt.shop_lat02) {
                            const [lon, lat] = getOffsettedCoord(pt.shop_lon02, pt.shop_lat02);
                            const markerContent = '<div style="width:14px;height:14px;background-color:#4A90E2;border-radius:50%;border:2px solid white;box-shadow: 0 0 3px rgba(0,0,0,0.5);"></div>';
                            const marker = new AMap.Marker({
                                position: [lon, lat],
                                map: map,
                                content: markerContent,
                                offset: new AMap.Pixel(-9, -9),
                                title: pt.shop_name || pt.shop_id,
                                extData: pt
                            });
                            
                            marker.on('click', function(me) {
                                const pData = me.target.getExtData();
                                let pContent = `<div class="info-window"><h4>聚集点信息</h4><table>`;
                                pContent += `<tr><th>聚客点名称</th><td>${pData.shop_name || ''}</td></tr>`;
                                pContent += `<tr><th>聚客点类型</th><td>${pData.shop_id || ''}</td></tr>`;
                                pContent += `</table></div>`;
                                
                                infoWindow.setContent(pContent);
                                infoWindow.open(map, me.target.getPosition());
                            });
                            
                            mapOverlays.push(marker);
                            blueMarkers.push(marker);
                        }
                    });
                }
            });

            // Auto fit view to show all polygons and markers
            map.setFitView(mapOverlays);

            // Toggle functionality
            document.getElementById('toggle-red').addEventListener('change', function(e) {
                redMarkers.forEach(m => e.target.checked ? m.show() : m.hide());
            });
            document.getElementById('toggle-green').addEventListener('change', function(e) {
                greenMarkers.forEach(m => e.target.checked ? m.show() : m.hide());
            });
            document.getElementById('toggle-blue').addEventListener('change', function(e) {
                blueMarkers.forEach(m => e.target.checked ? m.show() : m.hide());
            });

            // Click map background to clear info window
            map.on('click', function() {
                infoWindow.close();
            });
        })
        .catch(err => console.error("加载 xq_data.json 失败:", err));
</script>
</body>
</html>
